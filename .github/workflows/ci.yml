name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python tests/check.py
      - run: python tests/smoke.py

  # Builds the release zip without uploading it, so the package layout can be checked
  # (download the artifact from the run) before a version is tagged.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        with:
          args: -d
      - uses: actions/upload-artifact@v4
        with:
          name: jest-package
          path: .release/*.zip
          include-hidden-files: true # .release is a dot-folder, which upload-artifact skips by default
          if-no-files-found: error
